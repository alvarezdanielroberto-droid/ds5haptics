<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ds5haptics" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#1a2147"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#cfd6e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1040" cy="190" r="230" fill="url(#glow)"/>

  <!-- Ondas de vibración / haptic waves -->
  <g fill="none" stroke="#7aa2ff" stroke-linecap="round" opacity="0.8">
    <path d="M 830 125 q -22 65 0 130" stroke-width="5"/>
    <path d="M 806 103 q -34 87 0 174" stroke-width="4" opacity="0.55"/>
    <path d="M 1250 125 q 22 65 0 130" stroke-width="5"/>
  </g>

  <!-- Mando genérico / generic controller -->
  <g transform="translate(1040 195) scale(0.9)">
    <path d="M -175 -55 C -150 -95 -95 -100 -60 -85 L 60 -85 C 95 -100 150 -95 175 -55
             C 205 0 215 70 190 105 C 170 132 130 128 110 95 L 80 50 L -80 50 L -110 95
             C -130 128 -170 132 -190 105 C -215 70 -205 0 -175 -55 Z"
          fill="url(#pad)" stroke="#9aa6c4" stroke-width="3"/>
    <rect x="-52" y="-72" width="104" height="58" rx="12" fill="#232a44"/>
    <!-- cruceta -->
    <g fill="#3b4566">
      <rect x="-142" y="-44" width="18" height="54" rx="4"/>
      <rect x="-160" y="-26" width="54" height="18" rx="4"/>
    </g>
    <!-- botones -->
    <g fill="#3b4566">
      <circle cx="132" cy="-46" r="11"/>
      <circle cx="132" cy="0" r="11"/>
      <circle cx="110" cy="-23" r="11"/>
      <circle cx="154" cy="-23" r="11"/>
    </g>
    <!-- sticks -->
    <circle cx="-62" cy="22" r="24" fill="#2b3350"/>
    <circle cx="62" cy="22" r="24" fill="#2b3350"/>
    <circle cx="-62" cy="22" r="14" fill="#47527a"/>
    <circle cx="62" cy="22" r="14" fill="#47527a"/>
    <!-- luz -->
    <rect x="-40" y="-80" width="80" height="5" rx="2.5" fill="#5b8cff"/>
  </g>

  <!-- Texto -->
  <text x="80" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">ds5haptics</text>
  <text x="84" y="205" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#c9d3f5">Wireless DualSense on Windows, with everything</text>
  <text x="84" y="245" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#c9d3f5">El DualSense inalámbrico en Windows, con todo</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#0d1020" font-weight="600">
    <rect x="84" y="276" width="108" height="36" rx="18" fill="#7aa2ff"/>
    <text x="138" y="300" text-anchor="middle">Haptics</text>
    <rect x="202" y="276" width="186" height="36" rx="18" fill="#7aa2ff"/>
    <text x="295" y="300" text-anchor="middle">Adaptive triggers</text>
    <rect x="398" y="276" width="108" height="36" rx="18" fill="#7aa2ff"/>
    <text x="452" y="300" text-anchor="middle">Speaker</text>
    <rect x="516" y="276" width="196" height="36" rx="18" fill="#7aa2ff"/>
    <text x="614" y="300" text-anchor="middle">No extra hardware</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
